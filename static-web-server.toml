[general]
host = "::"
port = 8787
root = "/var/public"
log-level = "error"
compression = true
cache-control-headers = true
# SvelteKit SPA fallback: unknown paths serve 200.html so client-side routing handles them
page-fallback = "/var/public/200.html"

# Legacy URL redirects from briscycle.legacy
[[advanced.redirects]]
source = "^/gateway-bridge-cycleway/?$"
destination = "/moreton-bay/gateway-bridge-cycleway/"
kind = 301

